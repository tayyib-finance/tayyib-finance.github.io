<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tayyib Finance — Калькулятор рассрочки</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(135deg,#1a3a2a,#0d1f16); min-height:100vh;
    display:flex; justify-content:center; align-items:center; padding:15px; }
  .container { background:#fff; border-radius:22px; max-width:480px; width:100%;
    padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  h1 { font-size:22px; color:#1a3a2a; margin-bottom:4px; }
  .sub { color:#888; font-size:13px; margin-bottom:22px; }
  label { display:block; font-weight:600; font-size:14px; color:#333; margin:16px 0 6px; }
  .num { width:100%; padding:12px 14px; font-size:18px; font-weight:600;
    border:1.5px solid #cfe0d6; border-radius:12px; color:#1a3a2a;
    margin-bottom:8px; outline:none; }
  .num:focus { border-color:#1a7a4a; }
  input[type=range] { width:100%; accent-color:#1a7a4a; }
  .result { background:#f2f8f4; border-radius:16px; padding:18px; margin-top:22px; }
  .row { display:flex; justify-content:space-between; padding:7px 0;
    border-bottom:1px solid #e0eae4; font-size:14px; color:#555; }
  .row:last-child { border:none; }
  .row b { color:#1a3a2a; font-size:15px; }
  .pay { font-size:26px; font-weight:800; color:#1a7a4a; }
  .btn { display:block; text-align:center; background:#25D366; color:#fff;
    text-decoration:none; font-weight:700; padding:14px; border-radius:14px;
    margin-top:16px; font-size:16px; }
  .note { font-size:11px; color:#999; margin-top:12px; text-align:center; }
  .admin { display:none; background:#fff7e6; border:2px dashed #e0a800;
    border-radius:14px; padding:14px; margin-top:18px; }
  .admin label { margin-top:0; color:#8a6d00; }
  .admin input { width:100%; padding:10px; font-size:16px;
    border:1px solid #e0a800; border-radius:10px; }
  .admin .tag { font-size:11px; color:#b08900; margin-top:6px; }
</style>
</head>
<body>
<div class="container">
  <h1>Калькулятор рассрочки</h1>
  <div class="sub">Честная рассрочка без процентов и штрафов</div>

  <label>Стоимость товара, ₽</label>
  <input type="number" class="num" id="priceN" value="100000" min="0" inputmode="numeric">
  <input type="range" id="priceR" min="5000" max="500000" step="5000" value="100000">

  <label>Первый взнос, ₽</label>
  <input type="number" class="num" id="downN" value="10000" min="0" inputmode="numeric">
  <input type="range" id="downR" min="0" max="495000" step="5000" value="10000">

  <label>Срок договора, мес.</label>
  <input type="number" class="num" id="termN" value="5" min="1" max="12" inputmode="numeric">
  <input type="range" id="termR" min="1" max="12" step="1" value="5">

  <div class="admin" id="adminBox">
    <label>⚙️ Наценка, % в месяц (видно только вам)</label>
    <input type="number" id="rate" value="5" min="0" max="20" step="0.1">
    <div class="tag">Клиенты по обычной ссылке всегда видят 5%</div>
  </div>

  <div class="result">
    <div class="row"><span>Ежемесячный платёж</span><span class="pay" id="monthly">—</span></div>
    <div class="row"><span>Наценка</span><b id="markup">—</b></div>
    <div class="row"><span>Общая стоимость</span><b id="total">—</b></div>
  </div>

  <a class="btn" id="wa" href="#" target="_blank">📲 Отправить заявку в WhatsApp</a>
  <div class="note">Цена фиксируется в договоре и не меняется. Без скрытых платежей.</div>
</div>

<script>
  var CLIENT_RATE = 5;
  var PHONE = "79887836677";

  var isAdmin = (location.hash === "#admin");
  if (isAdmin) document.getElementById('adminBox').style.display = "block";

  var priceN = document.getElementById('priceN'), priceR = document.getElementById('priceR');
  var downN  = document.getElementById('downN'),  downR  = document.getElementById('downR');
  var termN  = document.getElementById('termN'),  termR  = document.getElementById('termR');
  var rateInput = document.getElementById('rate');

  function fmt(n){ return n.toLocaleString('ru-RU') + ' \u20BD'; }

  function getRate(){
    if (isAdmin) {
      var r = parseFloat(rateInput.value);
      if (isNaN(r) || r < 0) r = CLIENT_RATE;
      return r / 100;
    }
    return CLIENT_RATE / 100;
  }

  function calc(){
    var p = parseInt(priceN.value) || 0;
    var d = parseInt(downN.value) || 0;
    var t = parseInt(termN.value) || 1;

    if (t < 1) t = 1;
    if (t > 12) t = 12;
    if (d > p) { d = p; downN.value = d; }

    priceR.value = p; downR.value = d; termR.value = t;

    var fin = p - d;
    var markup = Math.round(fin * getRate() * t);
    var total = p + markup;
    var monthly = t > 0 ? Math.round((fin + markup) / t) : 0;

    document.getElementById('monthly').textContent = fmt(monthly);
    document.getElementById('markup').textContent = fmt(markup);
    document.getElementById('total').textContent = fmt(total);

    var msg = "Ассаляму алейкум! Хочу оформить рассрочку:\n" +
      "Товар: " + fmt(p) + "\n" +
      "Первый взнос: " + fmt(d) + "\n" +
      "Срок: " + t + " мес.\n" +
      "Платёж: " + fmt(monthly) + "/мес.\n" +
      "Общая стоимость: " + fmt(total);
    document.getElementById('wa').href =
      "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(msg);
  }

  // ползунок -> поле
  priceR.oninput = function(){ priceN.value = priceR.value; calc(); };
  downR.oninput  = function(){ downN.value  = downR.value;  calc(); };
  termR.oninput  = function(){ termN.value  = termR.value;  calc(); };

  // поле -> ползунок
  priceN.oninput = calc;
  downN.oninput = calc;
  termN.oninput = calc;
  rateInput.oninput = calc;

  calc();
</script>
</body>
</html>
